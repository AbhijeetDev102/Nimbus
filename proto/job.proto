syntax="proto3";
package job;
option go_package = "shared/proto/job;job";
service JobService {
    rpc CreateJob (CreateJobRequest) returns (CreateJobResponse);
    rpc GetJob (GetJobRequest) returns (GetJobResponse);
    rpc ListJobs (ListJobsRequest) returns (ListJobsResponse);
    rpc GetJobStats (GetJobStatsRequest) returns (GetJobStatsResponse);
}

message CreateJobRequest{
    optional string ResourceID=1;
    string JobType=2;
    bytes Parameters=3;
}

message CreateJobResponse{
    string JobId = 1;
    string Status = 2;
}

message GetJobRequest{
    string JobId =1;
}

message GetJobResponse{
    string JobId = 1;
    optional string ResourceID = 2;
    string JobType = 3;
    string Status = 4;
    int32 RetryCount = 5;
    int32 MaxRetries = 6;
    optional string ErrorMessage = 7;
    optional string OutputResourceID = 8;
    bytes Parameters = 12;
    bytes Metadata = 13;
    string CreatedAt = 9;
    optional string StartedAt = 10;
    optional string CompletedAt = 11;
}

message ListJobsRequest {
    int32 Limit = 1;
    int32 Offset = 2;
    optional string Status = 3;
    optional string JobType = 4;
}

message ListJobsResponse {
    repeated GetJobResponse Jobs = 1;
    int64 TotalCount = 2;
}

message GetJobStatsRequest {}

message GetJobStatsResponse {
    int64 Total = 1;
    int64 Queued = 2;
    int64 Running = 3;
    int64 Completed = 4;
    int64 Failed = 5;
}

