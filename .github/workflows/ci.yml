name: Nimbus CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # Job 1: Lint & Code Quality Gate
  # ----------------------------------------------------
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Verify Go Module Tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum has uncommitted changes. Run 'go mod tidy' locally and commit the result." && exit 1)

      - name: Run go vet
        run: go vet ./...

  # ----------------------------------------------------
  # Job 2: Hermetic Unit Tests & Race Detection
  # ----------------------------------------------------
  test:
    name: Unit Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Run Unit Tests with Race Detector
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.txt
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------
  # Job 3: Backend Microservices Matrix Build
  # ----------------------------------------------------
  build-backend:
    name: Build Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - job-service
          - resource-service
          - worker-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Compile ${{ matrix.service }}
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-w -s" -o bin/${{ matrix.service }} ./services/${{ matrix.service }}/cmd/main.go

  # ----------------------------------------------------
  # Job 4: Web Control Plane Dashboard Build
  # ----------------------------------------------------
  build-frontend:
    name: Build Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Application
        working-directory: web
        run: npm run build

  # ----------------------------------------------------
  # Job 5: Docker Container Build Verification
  # ----------------------------------------------------
  docker-verify:
    name: Docker Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [lint, test, build-backend, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
            context: .
          - name: job-service
            dockerfile: ./services/job-service/Dockerfile
            context: .
          - name: resource-service
            dockerfile: ./services/resource-service/Dockerfile
            context: .
          - name: worker-service
            dockerfile: ./services/worker-service/Dockerfile
            context: .
          - name: dashboard
            dockerfile: ./web/Dockerfile
            context: ./web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: nimbus/${{ matrix.name }}:ci-test
