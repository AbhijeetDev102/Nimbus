apiVersion: v1
kind: ConfigMap
metadata:
  name: nimbus-config
data:
  # Database
  POSTGRES_HOSTNAME: "postgres"

  # MinIO
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET_NAME: "resource-bucket"
  MINIO_USE_SSL: "false"

  # Kafka
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_CONSUMER_GROUP: "nimbus-worker-group"
  KAFKA_JOB_TOPIC: "job.events"

  # Internal Service URLs
  RESOURCE_SERVICE_URL: "resource-service:9093"
  JOB_SERVICE_URL: "job-service:9094"
  GATEWAY_HTTP_ADDR: ":8081"

  # Redis
  REDIS_ADDR: "redis:6379"
